#--------------------------------------------------
echo "Router (Network Side) Configuration"
#--------------------------------------------------
    router Base
        interface "system"
            address 2.2.2.2/32
            no shutdown
        exit
        interface "to-r1"
            address 10.0.12.2/30
            port 1/1/c2/1
            no shutdown
        exit
        interface "to-r3"
            address 10.0.23.1/30
            port 1/1/c3/1
            no shutdown
        exit
        interface "to-src"
            address 10.10.0.1/24
            port 1/1/c1/1
            no shutdown
        exit
#--------------------------------------------------
echo "OSPFv2 Configuration"
#--------------------------------------------------
        ospf 0
            area 0.0.0.0
                interface "system"
                    no shutdown
                exit
                interface "to-r1"
                    interface-type point-to-point
                    no shutdown
                exit
                interface "to-r3"
                    interface-type point-to-point
                    no shutdown
                exit
                interface "to-src"    
                    passive
                    no shutdown
                exit
            exit
            no shutdown
        exit
#--------------------------------------------------
echo "PIM Configuration"
#--------------------------------------------------
        pim
            interface "system"
            exit
            interface "to-r1"
            exit
            interface "to-r3"
            exit
            interface "to-src"
            exit
            rp
                static
                    address 3.3.3.3
                        group-prefix 239.0.0.0/8
                    exit
                exit
                bsr-candidate
                    shutdown
                exit
                rp-candidate
                    shutdown
                exit
            exit
            no shutdown
        exit
    exit
#--------------------------------------------------
echo "Router (Service Side) Configuration"
#--------------------------------------------------
    router Base
#--------------------------------------------------
echo "OSPFv2 Configuration"
#--------------------------------------------------
        ospf 0                        
            no shutdown
        exit
#--------------------------------------------------
echo "PIM Configuration"
#--------------------------------------------------
        pim
            no shutdown
        exit
    exit
