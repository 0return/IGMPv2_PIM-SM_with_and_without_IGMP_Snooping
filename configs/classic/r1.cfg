#--------------------------------------------------
echo "Router (Network Side) Configuration"
#--------------------------------------------------
    router Base
        interface "system"
            address 1.1.1.1/32
            no shutdown
        exit
        interface "to-lan-a"
            address 10.100.1.1/24
            port 1/1/c2/1
            no shutdown
        exit
        interface "to-lan-b"
            address 10.100.2.1/24
            port 1/1/c3/1
            no shutdown
        exit
        interface "to-r2"
            address 10.0.12.1/30
            port 1/1/c1/1
            no shutdown
        exit
        interface "to-r4"
            address 10.0.14.1/30
            port 1/1/c4/1
            no shutdown
        exit
#--------------------------------------------------
echo "OSPFv2 Configuration"
#--------------------------------------------------
        ospf 0
            area 0.0.0.0
                interface "system"
                    no shutdown
                exit
                interface "to-lan-a"
                    passive
                    no shutdown       
                exit
                interface "to-lan-b"
                    passive
                    no shutdown
                exit
                interface "to-r2"
                    interface-type point-to-point
                    metric 2
                    no shutdown
                exit
                interface "to-r4"
                    interface-type point-to-point
                    no shutdown
                exit
            exit
            no shutdown
        exit
#--------------------------------------------------
echo "IGMP Configuration"
#--------------------------------------------------
        igmp
            interface "to-lan-a"
                version 2
                no shutdown
            exit
            interface "to-lan-b"
                version 2
                no shutdown
            exit
            no shutdown
        exit
#--------------------------------------------------
echo "PIM Configuration"
#--------------------------------------------------
        pim
            interface "system"
            exit
            interface "to-lan-a"
            exit
            interface "to-lan-b"
            exit
            interface "to-r2"
            exit
            interface "to-r4"
            exit
            rp
                static
                    address 3.3.3.3
                        group-prefix 239.0.0.0/8
                    exit              
                exit
                bsr-candidate
                    shutdown
                exit
                rp-candidate
                    shutdown
                exit
            exit
            no shutdown
        exit
    exit
#--------------------------------------------------
echo "IGMP Configuration"
#--------------------------------------------------
        igmp
            query-interval 30
            no shutdown
        exit
#--------------------------------------------------
echo "PIM Configuration"
#--------------------------------------------------
        pim
            no shutdown
        exit
    exit
